<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./dashboard/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRUS Acceleration Dashboard</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(234, 191, 110, 0.18), transparent 24%),
          radial-gradient(circle at top right, rgba(125, 20, 43, 0.28), transparent 30%),
          linear-gradient(180deg, #641125 0%, #3f0815 38%, #23040b 100%);
        color: #f6e7ca;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 2px, transparent 2px 4px);
        opacity: 0.9;
      }

      body::after {
        inset: 12px;
        border: 1px solid rgba(223, 181, 99, 0.18);
        border-radius: 28px;
        box-shadow: inset 0 0 0 1px rgba(255, 243, 217, 0.04);
      }

      main {
        width: min(92vw, 680px);
        padding: 32px;
        border-radius: 28px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(145deg, rgba(129, 21, 44, 0.94), rgba(72, 10, 23, 0.97));
        border: 1px solid rgba(223, 181, 99, 0.22);
        box-shadow: 0 24px 60px rgba(8, 0, 2, 0.34);
      }

      main::before,
      main::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      main::before {
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.06) 0 2px, transparent 2px 5px);
        opacity: 0.42;
      }

      main::after {
        inset: 10px;
        border: 1px solid rgba(227, 186, 103, 0.12);
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(255, 246, 225, 0.03);
      }

      main > * {
        position: relative;
        z-index: 1;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      .eyebrow {
        margin-bottom: 10px;
        color: #f1c46f;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.74rem;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Baskerville", "Palatino Linotype", "Book Antiqua", serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 0.96;
        color: #f6e7ca;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 24px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        color: #4c0d18;
        background: linear-gradient(135deg, #f4dbab, #c9953a);
        border: 1px solid rgba(255, 242, 207, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">FRUS Acceleration Dashboard</p>
      <h1>Redirecting to the publishable dashboard.</h1>
      <p>If the page does not open automatically, use the link below.</p>
      <a href="./dashboard/">Open Dashboard</a>
    </main>
  </body>
</html>
