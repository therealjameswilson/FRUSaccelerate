<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./dashboard/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRUS Acceleration Dashboard</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(183, 138, 52, 0.2), transparent 26%),
          radial-gradient(circle at top right, rgba(31, 107, 103, 0.18), transparent 30%),
          linear-gradient(180deg, #f8f3eb 0%, #efe2ce 42%, #f3ecdf 100%);
        color: #1f2f34;
        font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 680px);
        padding: 32px;
        border-radius: 28px;
        background: rgba(255, 250, 243, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 20px 55px rgba(46, 50, 43, 0.12);
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      .eyebrow {
        margin-bottom: 10px;
        color: #bf5c36;
        text-transform: uppercase;
        letter-spacing: 0.17em;
        font-size: 0.74rem;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Baskerville", "Palatino Linotype", "Book Antiqua", serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 0.96;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 24px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, #d06339, #9f4224);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">FRUS Acceleration Dashboard</p>
      <h1>Redirecting to the publishable dashboard.</h1>
      <p>If the page does not open automatically, use the link below.</p>
      <a href="./dashboard/">Open Dashboard</a>
    </main>
  </body>
</html>
